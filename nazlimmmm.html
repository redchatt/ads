<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Earn App</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { background: #0b0b0b; color: #fff; font-family: sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #161616; padding: 20px; border-radius: 10px; border: 1px solid #333; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; border-bottom: 1px solid #333; text-align: left; font-size: 14px; }
        button { padding: 6px 12px; background: #00ff88; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
        button.cancel { background: #ff4444; color: #fff; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h2>Admin Panel - Çıxarış Tələbləri</h2>
        <table>
            <thead>
                <tr>
                    <th>İstifadəçi</th>
                    <th>Məbləğ</th>
                    <th>Status</th>
                    <th>Əməliyyat</th>
                </tr>
            </thead>
            <tbody id="withdrawRequests">
                <!-- Dinamik doldurulacaq -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://adss-8257b-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref('withdraws').on('value', snapshot => {
        let html = '';
        snapshot.forEach(child => {
            let id = child.key;
            let w = child.val();
            html += `<tr>
                <td>${w.userName}</td>
                <td>${w.amount} AZN</td>
                <td><b>${w.status}</b></td>
                <td>
                    <button onclick="updateStatus('${id}', 'Təsdiqləndi')">Təsdiq</button>
                    <button class="cancel" onclick="updateStatus('${id}', 'Ləğv edildi')">Ləğv</button>
                </td>
            </tr>`;
        });
        document.getElementById('withdrawRequests').innerHTML = html;
    });

    function updateStatus(id, status) {
        db.ref('withdraws/' + id).update({ status: status });
        alert("Status yeniləndi: " + status);
    }
</script>
</body>
</html>
