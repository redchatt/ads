<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Vortex Ads</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .login-box, .admin-box { max-width: 600px; margin: 30px auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: none; font-size: 15px; }
        input { background: #334155; color: #fff; }
        button { background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; }
        button:hover { background: #0284c7; color: #fff; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #334155; padding: 15px; border-radius: 8px; text-align: center; }
        .stat-card div { font-size: 22px; font-weight: bold; color: #4ade80; margin-top: 5px; }
        
        .section { background: #334155; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .section h3 { margin-bottom: 10px; color: #facc15; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        table, th, td { border: 1px solid #475569; }
        th, td { padding: 8px; text-align: left; font-size: 13px; }
        th { background: #1e293b; color: #38bdf8; }
        
        .btn-danger { background: #ef4444; color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-success { background: #22c55e; color: white; }
    </style>
</head>
<body>

<!-- Login Ekranı -->
<div class="login-box" id="loginBox">
    <h2>Admin Girişi</h2>
    <input type="text" id="adminLogin" placeholder="Login">
    <input type="password" id="adminPass" placeholder="Şifrə">
    <button onclick="login()">Giriş Et</button>
</div>

<!-- Admin Panel Paneli -->
<div class="admin-box" id="adminPanel" style="display: none;">
    <h2>Vortex Ads - Admin İdarəetmə</h2>

    <!-- İstatistikalər -->
    <div class="stats-grid">
        <div class="stat-card">
            Ümumi İstifadəçi
            <div id="statUsers">0</div>
        </div>
        <div class="stat-card">
            Günlük İzlenen Reklam
            <div id="statDailyAds">0</div>
        </div>
    </div>

    <!-- Reklamları Sıfırlama -->
    <div class="section">
        <h3>Reklam Sayğacını Yenilə</h3>
        <p>Bütün istifadəçilərin baxdığı reklam sayını <b>0/50</b> elə:</p>
        <button class="btn-warning" onclick="resetAdCounter()">Reklam Sayğacını Sıfırla (0/50 et)</button>
    </div>

    <!-- İstifadəçi Balans İdarəetməsi -->
    <div class="section">
        <h3>İstifadəçi Balansı</h3>
        <p>Cari Balans: <b id="currentBalanceDisplay">0.00 AZN</b></p>
        <input type="number" id="balanceAmount" placeholder="Məbləğ (AZN)">
        <div style="display: flex; gap: 10px;">
            <button class="btn-success" onclick="modifyBalance('add')">Balans Əlavə Et</button>
            <button class="btn-danger" onclick="modifyBalance('subtract')">Balans Sil</button>
        </div>
    </div>

    <!-- Ban İdarəetməsi -->
    <div class="section">
        <h3>İstifadəçi Ban/Aç</h3>
        <p>Status: <b id="banStatusDisplay">Aktivdir</b></p>
        <button id="banBtn" class="btn-danger" onclick="toggleBan()">İstifadəçini Banla</button>
    </div>

    <!-- Çıxarış Sorğuları -->
    <div class="section">
        <h3>Çıxarış Sorğuları</h3>
        <button class="btn-danger" style="padding: 5px; margin-bottom: 5px;" onclick="clearWithdrawals()">Siyahını Təmizlə</button>
        <table>
            <thead>
                <tr>
                    <th>Üsul</th>
                    <th>Hesab/Nömrə</th>
                    <th>Məbləğ</th>
                    <th>Tarix</th>
                </tr>
            </thead>
            <tbody id="withdrawTableBody">
            </tbody>
        </table>
    </div>

    <button class="btn-danger" onclick="logout()">Sistemdən Çıx</button>
</div>

<script>
    function login() {
        let user = document.getElementById('adminLogin').value;
        let pass = document.getElementById('adminPass').value;

        if (user === 'Escobaradss667' && pass === 'Qaqas678_45Fgs') {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadAdminData();
        } else {
            alert('Giriş məlumatları yanlışdır!');
        }
    }

    function logout() {
        document.getElementById('loginBox').style.display = 'block';
        document.getElementById('adminPanel').style.display = 'none';
    }

    function loadAdminData() {
        // İstifadəçi sayı və günlük reklam statistikası
        document.getElementById('statUsers').innerText = localStorage.getItem('bot_total_users') || '0';
        document.getElementById('statDailyAds').innerText = localStorage.getItem('daily_total_ads') || '0';

        // Balans baxma
        let balance = parseFloat(localStorage.getItem('user_balance') || '0.00');
        document.getElementById('currentBalanceDisplay').innerText = balance.toFixed(2) + ' AZN';

        // Ban statusu
        let isBanned = localStorage.getItem('user_banned') === 'true';
        let banStatusDisplay = document.getElementById('banStatusDisplay');
        let banBtn = document.getElementById('banBtn');

        if (isBanned) {
            banStatusDisplay.innerText = 'BANLANIB';
            banStatusDisplay.style.color = '#ef4444';
            banBtn.innerText = 'Banı Qaldır';
            banBtn.className = 'btn-success';
        } else {
            banStatusDisplay.innerText = 'Aktivdir';
            banStatusDisplay.style.color = '#4ade80';
            banBtn.innerText = 'İstifadəçini Banla';
            banBtn.className = 'btn-danger';
        }

        // Çıxarış sorğularının cədvəli
        let withdrawals = JSON.parse(localStorage.getItem('withdraw_requests') || '[]');
        let tbody = document.getElementById('withdrawTableBody');
        tbody.innerHTML = '';

        withdrawals.forEach(req => {
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${req.method}</td>
                <td>${req.account}</td>
                <td>${req.amount} AZN</td>
                <td>${req.date}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Reklam sayğacını sıfırlayıb 0/50 etmək
    function resetAdCounter() {
        localStorage.setItem('user_ads_watched', '0');
        alert('İstifadəçilərin reklam sayğacı yeniləndi (0/50)!');
        loadAdminData();
    }

    // Balansı artırıb/azaltmaq
    function modifyBalance(action) {
        let amount = parseFloat(document.getElementById('balanceAmount').value);
        if (isNaN(amount) || amount <= 0) {
            alert('Düzgün məbləğ yazın!');
            return;
        }

        let currentBalance = parseFloat(localStorage.getItem('user_balance') || '0.00');
        if (action === 'add') {
            currentBalance += amount;
        } else if (action === 'subtract') {
            currentBalance = Math.max(0, currentBalance - amount);
        }

        localStorage.setItem('user_balance', currentBalance);
        document.getElementById('balanceAmount').value = '';
        alert('Balans yeniləndi!');
        loadAdminData();
    }

    // Ban/Aç funksiyası
    function toggleBan() {
        let isBanned = localStorage.getItem('user_banned') === 'true';
        localStorage.setItem('user_banned', !isBanned);
        loadAdminData();
    }

    // Çıxarış siyahısını təmizlə
    function clearWithdrawals() {
        if(confirm('Bütün sorğuları silmək istədiyinizə əminsiniz?')) {
            localStorage.removeItem('withdraw_requests');
            loadAdminData();
        }
    }

    // Məlumatları 2 saniyədən bir avtomatik yenilə
    setInterval(loadAdminData, 2000);
</script>

</body>
</html>
